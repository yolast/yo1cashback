# ============================================================
# YO1Cashback — Nginx configuration
# Domains: yo1cashback.com / www.yo1cashback.com (frontend)
#          api.yo1cashback.com (backend API)
# SSL-ready: certificates are provisioned with Certbot (Let's Encrypt).
#   SAN certificate covers: yo1cashback.com, www.yo1cashback.com, api.yo1cashback.com
#   -> /etc/letsencrypt/live/yo1cashback.com/
# ============================================================

# ------------------------------------------------------------
# HTTP -> HTTPS redirect (all domains) + ACME challenge
# ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name yo1cashback.com www.yo1cashback.com api.yo1cashback.com;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------
# Frontend — Next.js (yo1cashback.com + www.yo1cashback.com)
# ------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yo1cashback.com www.yo1cashback.com;

    ssl_certificate     /etc/letsencrypt/live/yo1cashback.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yo1cashback.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ------------------------------------------------------------
# Backend API — Node.js/Express (api.yo1cashback.com)
# ------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yo1cashback.com;

    ssl_certificate     /etc/letsencrypt/live/yo1cashback.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yo1cashback.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 10m;

    gzip on;
    gzip_types application/json;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
